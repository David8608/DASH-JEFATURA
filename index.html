<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torre de Control Operativa · Gerencia Nacional de Operaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* =========================================================
   TORRE DE CONTROL OPERATIVA — SISTEMA DE DISEÑO
   Paleta: navy clínico + teal logística (evita defaults de IA)
   Tipografía: Space Grotesk (cifras/títulos) + Inter (UI) + IBM Plex Mono (datos tabulares)
   ========================================================= */
:root{
  --bg:#F3F6FA;
  --surface:#FFFFFF;
  --surface-2:#F8FAFD;
  --surface-hover:#EEF2F8;
  --ink:#101B2D;
  --ink-muted:#5B6577;
  --ink-faint:#8892A0;
  --border:#E3E9F2;
  --border-strong:#CBD5E3;
  --brand:#123A5E;
  --brand-strong:#0C2A45;
  --brand-soft:#E7EEF6;
  --accent:#0E7C86;
  --accent-soft:#E3F3F3;
  --good:#1E9E6B;
  --good-soft:#E4F6EE;
  --warn:#B8791A;
  --warn-soft:#FBF1DD;
  --bad:#C13B48;
  --bad-soft:#FBE7E8;
  --shadow-sm:0 1px 2px rgba(16,27,45,.05), 0 1px 1px rgba(16,27,45,.04);
  --shadow-md:0 4px 16px rgba(16,27,45,.07), 0 1px 3px rgba(16,27,45,.05);
  --shadow-lg:0 12px 32px rgba(16,27,45,.12), 0 2px 8px rgba(16,27,45,.06);
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;
  --font-display:'Space Grotesk', 'Inter', sans-serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono:'IBM Plex Mono', 'SFMono-Regular', monospace;
  --sidebar-w:264px;
  --topbar-h:76px;
}
html[data-theme="dark"]{
  --bg:#0A121F;
  --surface:#121B2C;
  --surface-2:#0D1524;
  --surface-hover:#1A2538;
  --ink:#E8EDF6;
  --ink-muted:#96A2B8;
  --ink-faint:#69758C;
  --border:#22304A;
  --border-strong:#2E3F5C;
  --brand:#5B95CC;
  --brand-strong:#7CAEDE;
  --brand-soft:#16283D;
  --accent:#38C1C4;
  --accent-soft:#0F2C2E;
  --good:#3FC98D;
  --good-soft:#0F2A21;
  --warn:#E8B64E;
  --warn-soft:#2E2410;
  --bad:#E8707C;
  --bad-soft:#301518;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 16px rgba(0,0,0,.35);
  --shadow-lg:0 16px 40px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease, color .25s ease;
}
::selection{background:var(--accent-soft); color:var(--ink);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:20px;}
a{color:inherit;}
button{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
.mono{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}

/* ---------- LOADING SCREEN ---------- */
#loading-screen{
  position:fixed; inset:0; z-index:9999;
  background:var(--brand-strong);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; gap:22px;
  transition:opacity .5s ease, visibility .5s ease;
}
#loading-screen.hidden{opacity:0; visibility:hidden; pointer-events:none;}
.loader-mark{display:flex; align-items:center; gap:14px;}
.loader-mark svg{width:40px;height:40px;}
.loader-title{font-family:var(--font-display); font-size:20px; font-weight:600; letter-spacing:.02em;}
.loader-sub{font-size:12.5px; color:rgba(255,255,255,.65); letter-spacing:.03em; text-transform:uppercase;}
.progress-track{width:280px; height:4px; background:rgba(255,255,255,.18); border-radius:4px; overflow:hidden;}
.progress-fill{height:100%; width:0%; background:linear-gradient(90deg,#38C1C4,#5B95CC); border-radius:4px; transition:width .3s ease;}
.progress-pct{font-family:var(--font-mono); font-size:12px; color:rgba(255,255,255,.7);}

/* ---------- LAYOUT ---------- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:var(--sidebar-w); flex-shrink:0;
  background:var(--brand-strong);
  color:#EAF1F8;
  position:fixed; top:0; left:0; bottom:0;
  display:flex; flex-direction:column;
  z-index:100;
  transition:transform .3s ease, background .25s ease;
}
.sidebar-brand{
  padding:24px 22px 18px; display:flex; align-items:center; gap:12px;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.sidebar-brand .mark{
  width:38px; height:38px; border-radius:10px;
  background:linear-gradient(135deg,#38C1C4,#123A5E);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
}
.sidebar-brand .mark svg{width:20px;height:20px;}
.sidebar-brand .text{line-height:1.25;}
.sidebar-brand .text .t1{font-family:var(--font-display); font-weight:600; font-size:14.5px; color:#fff;}
.sidebar-brand .text .t2{font-size:11px; color:rgba(255,255,255,.55); letter-spacing:.03em;}

.sidebar-nav{flex:1; overflow-y:auto; padding:14px 12px;}
.nav-group-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;
  color:rgba(255,255,255,.38); padding:14px 12px 6px; font-weight:600;
}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:9px 12px; border-radius:9px; cursor:pointer;
  color:rgba(234,241,248,.75); font-size:13.2px; font-weight:500;
  transition:background .15s ease, color .15s ease;
  margin-bottom:2px; border:none; background:none; width:100%; text-align:left;
}
.nav-item svg{width:16px;height:16px; flex-shrink:0; opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:rgba(56,193,196,.16); color:#fff;}
.nav-item.active svg{color:#38C1C4; opacity:1;}
.nav-item .count{
  margin-left:auto; font-family:var(--font-mono); font-size:10.5px;
  background:rgba(255,255,255,.1); padding:1px 6px; border-radius:20px; color:rgba(255,255,255,.7);
}
.nav-item .count.alert{background:var(--bad); color:#fff;}

.sidebar-foot{padding:14px 20px 20px; border-top:1px solid rgba(255,255,255,.08);}
.upload-btn{
  display:flex; align-items:center; gap:9px; width:100%;
  padding:9px 12px; border-radius:9px; border:1px dashed rgba(255,255,255,.28);
  background:rgba(255,255,255,.04); color:rgba(255,255,255,.8);
  font-size:12.5px; cursor:pointer; transition:all .15s ease;
}
.upload-btn:hover{background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.45);}
.upload-btn svg{width:15px;height:15px;}

.main{margin-left:var(--sidebar-w); flex:1; min-width:0; display:flex; flex-direction:column;}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky; top:0; z-index:60;
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:14px 32px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  backdrop-filter:blur(8px);
}
.topbar-title{margin-right:auto; min-width:220px;}
.topbar-title h1{font-size:18px; font-weight:600; color:var(--ink);}
.topbar-title .meta{font-size:11.5px; color:var(--ink-faint); margin-top:2px; display:flex; align-items:center; gap:6px;}
.dot-live{width:6px;height:6px;border-radius:50%; background:var(--good); box-shadow:0 0 0 3px var(--good-soft); animation:pulse 2.2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

.filter-group{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.filter-dd{position:relative;}
.filter-btn{
  display:flex; align-items:center; gap:7px;
  padding:8px 13px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--ink-muted); font-size:12.8px; font-weight:500;
  cursor:pointer; transition:all .15s ease; white-space:nowrap;
}
.filter-btn:hover{border-color:var(--border-strong); color:var(--ink);}
.filter-btn.has-value{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
.filter-btn svg{width:13px;height:13px;}
.filter-panel{
  position:absolute; top:calc(100% + 8px); left:0; min-width:220px; max-height:280px; overflow-y:auto;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md);
  box-shadow:var(--shadow-lg); padding:8px; z-index:80; display:none;
}
.filter-panel.open{display:block;}
.filter-opt{
  display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px;
  cursor:pointer; font-size:12.8px; color:var(--ink);
}
.filter-opt:hover{background:var(--surface-hover);}
.filter-opt input{accent-color:var(--accent);}
.icon-btn{
  width:36px;height:36px; border-radius:9px; border:1px solid var(--border);
  background:var(--surface-2); display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--ink-muted); transition:all .15s ease; flex-shrink:0;
}
.icon-btn:hover{border-color:var(--border-strong); color:var(--ink); background:var(--surface-hover);}
.icon-btn svg{width:16px;height:16px;}
.clear-filters{
  font-size:12px; color:var(--ink-faint); cursor:pointer; text-decoration:underline;
  text-underline-offset:2px; display:none; white-space:nowrap;
}
.clear-filters.show{display:inline;}

/* ---------- CONTENT ---------- */
.content{padding:28px 32px 80px; max-width:1520px;}
.section{scroll-margin-top:24px; margin-bottom:56px;}
.section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:18px; gap:16px; flex-wrap:wrap;}
.section-head .titles{display:flex; align-items:center; gap:10px;}
.section-num{
  font-family:var(--font-mono); font-size:11px; color:var(--ink-faint);
  background:var(--surface-2); border:1px solid var(--border); padding:2px 8px; border-radius:20px;
}
.section-head h2{font-size:19px; font-weight:600;}
.section-sub{font-size:12.5px; color:var(--ink-faint); margin-top:3px;}

.grid{display:grid; gap:16px;}
.grid-kpi{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr));}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:20px 22px; box-shadow:var(--shadow-sm); transition:box-shadow .2s ease, transform .2s ease, border-color .2s ease;
}
.card.hoverable:hover{box-shadow:var(--shadow-md); transform:translateY(-2px); border-color:var(--border-strong);}
.card-title{font-size:12.5px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:14px;}

/* KPI card */
.kpi-card{display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden;}
.kpi-top{display:flex; align-items:flex-start; justify-content:space-between;}
.kpi-icon{width:34px;height:34px;border-radius:9px; display:flex;align-items:center;justify-content:center; flex-shrink:0;}
.kpi-icon svg{width:17px;height:17px;}
.kpi-label{font-size:12.2px; color:var(--ink-muted); font-weight:500; margin-bottom:2px;}
.kpi-value{font-family:var(--font-display); font-size:27px; font-weight:600; letter-spacing:-.01em; color:var(--ink);}
.kpi-value .unit{font-size:14px; font-weight:500; color:var(--ink-faint); margin-left:3px;}
.kpi-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:2px;}
.kpi-delta{display:flex; align-items:center; gap:4px; font-size:12px; font-weight:600; padding:3px 8px; border-radius:20px;}
.kpi-delta.up{color:var(--good); background:var(--good-soft);}
.kpi-delta.down{color:var(--bad); background:var(--bad-soft);}
.kpi-delta.flat{color:var(--ink-faint); background:var(--surface-2);}
.kpi-delta svg{width:11px;height:11px;}
.kpi-spark{width:90px; height:28px;}

/* semaforo pill */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px;}
.pill svg{width:7px;height:7px;}
.pill.good{background:var(--good-soft); color:var(--good);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.bad{background:var(--bad-soft); color:var(--bad);}
.dot{width:7px;height:7px;border-radius:50%; display:inline-block; flex-shrink:0;}
.dot.good{background:var(--good);}
.dot.warn{background:var(--warn);}
.dot.bad{background:var(--bad);}

.chart-card canvas{max-height:280px;}
.chart-wrap{position:relative; height:270px;}
.chart-wrap.tall{height:320px;}

/* Ranking list */
.rank-list{display:flex; flex-direction:column; gap:2px;}
.rank-row{display:flex; align-items:center; gap:12px; padding:9px 4px; border-bottom:1px solid var(--border);}
.rank-row:last-child{border-bottom:none;}
.rank-pos{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); width:18px; flex-shrink:0;}
.rank-name{flex:1; min-width:0; font-size:13px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rank-bar-track{flex:1; height:6px; background:var(--surface-2); border-radius:20px; overflow:hidden; max-width:130px;}
.rank-bar-fill{height:100%; border-radius:20px; background:var(--accent);}
.rank-value{font-family:var(--font-mono); font-size:12.5px; font-weight:600; color:var(--ink); width:auto; text-align:right; flex-shrink:0;}

/* Alertas */
.alert-item{
  display:flex; gap:13px; padding:14px 16px; border-radius:var(--radius-md);
  border:1px solid var(--border); background:var(--surface-2); align-items:flex-start;
}
.alert-icon{width:30px;height:30px;border-radius:8px; display:flex;align-items:center;justify-content:center; flex-shrink:0;}
.alert-icon svg{width:15px;height:15px;}
.alert-body{flex:1; min-width:0;}
.alert-title{font-size:13.2px; font-weight:600; margin-bottom:2px;}
.alert-desc{font-size:12.3px; color:var(--ink-muted); line-height:1.5;}
.alert-list{display:flex; flex-direction:column; gap:10px;}
.empty-alerts{
  display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;
  padding:36px 20px; color:var(--ink-faint);
}
.empty-alerts svg{width:34px;height:34px; color:var(--good);}

/* Insights */
.insight-card{display:flex; gap:14px; align-items:flex-start;}
.insight-num{
  font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--accent);
  width:36px; flex-shrink:0;
}
.insight-text{font-size:13.3px; color:var(--ink); line-height:1.55;}
.insight-text b{color:var(--brand);}
html[data-theme="dark"] .insight-text b{color:var(--brand-strong);}
.insight-text .tag{
  display:inline-block; font-size:10.5px; font-weight:600; color:var(--ink-faint);
  text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;
}

/* Table */
.table-toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.search-box{
  display:flex; align-items:center; gap:8px; padding:8px 13px; border-radius:9px;
  border:1px solid var(--border); background:var(--surface-2); flex:1; min-width:220px; max-width:340px;
}
.search-box svg{width:14px;height:14px; color:var(--ink-faint); flex-shrink:0;}
.search-box input{border:none; background:none; outline:none; font-size:13px; color:var(--ink); width:100%; font-family:var(--font-body);}
.search-box input::placeholder{color:var(--ink-faint);}
.toolbar-spacer{flex:1;}
.btn{
  display:flex; align-items:center; gap:7px; padding:8px 14px; border-radius:9px;
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink); font-size:12.6px; font-weight:500;
  cursor:pointer; transition:all .15s ease; white-space:nowrap;
}
.btn:hover{border-color:var(--border-strong); background:var(--surface-hover);}
.btn svg{width:14px;height:14px;}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff;}
.btn.primary:hover{background:var(--brand-strong);}

.table-scroll{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-md);}
table.data-table{width:100%; border-collapse:collapse; font-size:12.8px;}
table.data-table thead th{
  position:sticky; top:0; background:var(--surface-2); z-index:2;
  text-align:left; padding:11px 14px; font-weight:600; color:var(--ink-muted);
  border-bottom:1px solid var(--border); white-space:nowrap; cursor:pointer; user-select:none;
  font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;
}
table.data-table thead th:hover{color:var(--ink);}
table.data-table thead th .sort-ic{display:inline-block; width:9px; margin-left:3px; opacity:.4;}
table.data-table thead th.sorted .sort-ic{opacity:1; color:var(--accent);}
table.data-table tbody td{
  padding:10px 14px; border-bottom:1px solid var(--border); color:var(--ink);
  font-family:var(--font-mono); white-space:nowrap;
}
table.data-table tbody td.txt{font-family:var(--font-body);}
table.data-table tbody tr:hover{background:var(--surface-hover);}
table.data-table tbody tr:last-child td{border-bottom:none;}
.table-footer{display:flex; align-items:center; justify-content:space-between; margin-top:14px; flex-wrap:wrap; gap:10px;}
.table-info{font-size:12px; color:var(--ink-faint);}
.pagination{display:flex; align-items:center; gap:5px;}
.page-btn{
  width:30px;height:30px; border-radius:7px; border:1px solid var(--border); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:12px; color:var(--ink-muted);
}
.page-btn:hover:not(:disabled){border-color:var(--border-strong); color:var(--ink);}
.page-btn.active{background:var(--brand); border-color:var(--brand); color:#fff;}
.page-btn:disabled{opacity:.4; cursor:not-allowed;}
.page-btn svg{width:13px;height:13px;}

/* Matrix / heat table used in productividad */
.heat-cell{font-family:var(--font-mono); text-align:center; font-weight:600; border-radius:6px; padding:5px 0;}

/* Tooltip custom (native title fallback + small hint) */
[data-tip]{position:relative;}

/* Toggle theme switch */
.theme-toggle{
  display:flex; align-items:center; background:var(--surface-2); border:1px solid var(--border);
  border-radius:20px; padding:3px; gap:2px; cursor:pointer;
}
.theme-toggle button{
  border:none; background:none; width:30px;height:26px; border-radius:16px; display:flex;
  align-items:center; justify-content:center; cursor:pointer; color:var(--ink-faint); transition:all .15s ease;
}
.theme-toggle button svg{width:14px;height:14px;}
.theme-toggle button.active{background:var(--brand); color:#fff;}

/* Empty module state (hidden module fallback) */
.module-hidden{display:none !important;}

/* footer note */
.foot-note{
  text-align:center; padding:26px 0 6px; color:var(--ink-faint); font-size:11.5px;
}

/* Responsive */
.sidebar-toggle{display:none;}
@media (max-width: 980px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .sidebar-toggle{
    display:flex; width:36px;height:36px;border-radius:9px;border:1px solid var(--border);
    background:var(--surface-2); align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  }
  .sidebar-toggle svg{width:17px;height:17px;color:var(--ink-muted);}
  .content{padding:22px 16px 70px;}
  .topbar{padding:12px 16px;}
}
@media (max-width:600px){
  .grid-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));}
  .topbar-title h1{font-size:15.5px;}
}

/* Print styles */
@media print{
  .sidebar, .topbar, .sidebar-toggle, .btn, .table-toolbar, .table-footer{display:none !important;}
  .main{margin-left:0 !important;}
  body{background:#fff !important; color:#000 !important;}
  .section{margin-bottom:20px;}
  .card{box-shadow:none !important; border:1px solid #ccc !important;}
}

/* Reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important; transition-duration:.001s !important;}
}
</style>
</head>
<body>

  const map = new Map();
  (data.ingreso||[]).forEach(r=>{
    const key = r.cliente+'|'+r.mes;
    map.set(key, {
      cliente:r.cliente, ceco:r.ceco, mes:r.mes,
      ingreso:r.ingreso, costo:r.costo, rentabilidad:r.rentabilidad,
      entregado:r.entregado, cerradoNovedad:r.cerradoNovedad, percapita:r.percapita
    });
  });
  (data.volumen||[]).forEach(r=>{
    const key = r.cliente+'|'+r.mes;
    const o = map.get(key) || {cliente:r.cliente, ceco:r.ceco, mes:r.mes};
    o.entregado = r.entregado; o.cerradoNovedad = r.cerradoNovedad;
    o.totalEntregado = r.totalEntregado; o.efectividad = r.efectividad;
    map.set(key,o);
  });
  (data.tiempos||[]).forEach(r=>{
    const key = r.cliente+'|'+r.mes;
    const o = map.get(key) || {cliente:r.cliente, ceco:r.ceco, mes:r.mes};
    o.tiempoMin = r.tiempoMin;
    map.set(key,o);
  });
  return Array.from(map.values()).sort((a,b)=> (MES_ORDEN[a.mes]||99)-(MES_ORDEN[b.mes]||99) || String(a.cliente).localeCompare(String(b.cliente)));
}

/* Carga inicial desde el JSON embebido en el propio archivo HTML */
function cargarDatosEmbebidos(){
  const el = document.getElementById('embedded-data');
  const data = JSON.parse(el.textContent);

  STATE.operativa = construirOperativa(data);
}

/* Whitelist de columnas permitidas por hoja al leer un Excel cargado por el usuario.
   Esto garantiza que, aunque el archivo cargado contenga columnas sensibles (nombre,
   cédula, teléfono, dirección, observaciones personales, etc.), NUNCA se incorporen
   al estado de la aplicación ni se rendericen en el dashboard. */
function extraerHojaSegura(workbook, nombreHoja, mapeoColumnas){
  if(!workbook.SheetNames.includes(nombreHoja)) return [];
  const ws = workbook.Sheets[nombreHoja];
  const json = XLSX.utils.sheet_to_json(ws, {defval:null, raw:true});
  return json.map(fila=>{
    const out = {};
    Object.keys(mapeoColumnas).forEach(campoDestino=>{
      const posiblesNombres = mapeoColumnas[campoDestino];
      let valor = null;
      for(const nombreCol of posiblesNombres){
        if(Object.prototype.hasOwnProperty.call(fila, nombreCol)){ valor = fila[nombreCol]; break; }
      }
      out[campoDestino] = (typeof valor === 'string') ? valor.trim() : valor;
    });
    return out;
  }).filter(f=> Object.values(f).some(v=>v!==null && v!==''));
}

function horaExcelAMinutos(valor){
  if(valor==null) return null;
  if(typeof valor === 'number'){ return Math.round(valor*24*60*100)/100; } // fracción de día -> minutos
  if(typeof valor === 'string'){
    const m = valor.match(/^(\d{1,2}):(\d{2})/);
    if(m) return parseInt(m[1])*60+parseInt(m[2]);
  }
  return null;
}

/* Procesa un workbook de SheetJS reemplazando el dataset activo (recalcula todo) */
function procesarWorkbookCargado(workbook){
  const ingreso = extraerHojaSegura(workbook, 'INGRESO', {
    cliente:['CLIENTE'], ceco:['CECO'], mes:['MES'], ingreso:['INGRESO'], costo:['COSTO'],
    rentabilidad:['RENTABILIDAD'], entregado:['ENTREGADO'], cerradoNovedad:['CERRADO CON NOVEDAD'], percapita:['PERCAPITA']
  });
  const volumen = extraerHojaSegura(workbook, 'VOLUMEN', {
    cliente:['CLIENTE'], ceco:['CECO'], mes:['MES'], entregado:['ENTREGADO'], cerradoNovedad:['CERRADO CON NOVEDAD'],
    totalEntregado:['TOTAL ENTREGADO'], efectividad:['EFECTIVIDAD']
  });
  const tiemposRaw = extraerHojaSegura(workbook, 'TIEMPOS', {
    cliente:['CLIENTE'], ceco:['CECO'], mes:['MES'], tiempoMin:['TIEMPO']
  });
  const tiempos = tiemposRaw.map(r=> ({...r, tiempoMin: horaExcelAMinutos(r.tiempoMin)}));

  // RESTRICCIONES: se agregan de inmediato y se descartan los campos identificables.
  let restriccionesAgregado = {total:0, porCiudad:{}, porEstado:{}};
  if(workbook.SheetNames.includes('RESTRICCIONES')){
    const ws = workbook.Sheets['RESTRICCIONES'];
    const json = XLSX.utils.sheet_to_json(ws, {defval:null, raw:true});
    const estadoCol = Object.keys(json[0]||{}).find(k=>k.toUpperCase().startsWith('ESTADO'));
    restriccionesAgregado.total = json.length;
    json.forEach(f=>{
      const ciudad = (f['CIUDAD']||'SIN DATO').toString().trim() || 'SIN DATO';
      const estadoFull = (estadoCol ? (f[estadoCol]||'') : '').toString().toUpperCase();
      let cat = 'OTRO';
      if(estadoFull.includes('ACTIVO')) cat='ACTIVO CON RESTRICCION';
      else if(estadoFull.includes('INCAPA')) cat='INCAPACIDAD';
      else if(estadoFull.includes('RENUNCIO')) cat='RENUNCIO';
      restriccionesAgregado.porCiudad[ciudad] = (restriccionesAgregado.porCiudad[ciudad]||0)+1;
      restriccionesAgregado.porEstado[cat] = (restriccionesAgregado.porEstado[cat]||0)+1;
    });
  }

  // SINIESTROS: se excluyen RESPONSABLE, CEDULA, PLACA y el detalle narrativo de los hechos.
  const siniestros = extraerHojaSegura(workbook, 'SINIESTROS', {
    motivo:['MOTIVO STANDAR'], proyecto:['PROYECTO'], mes:['MES NOVEDAD'], anio:['AÑO'],
    valor:['VALOR'], ciudad:['CIUDAD'], fecha:['FECHA DEL SINIESTRO'],
    pagoCliente:['PAGO AL CLIENTE'], siniestroCerrado:['SINIESTRO CERRADO (si - no)','SINIESTRO CERRADO']
  }).map(s=>({...s, motivo: s.motivo ? s.motivo.toString().trim() : s.motivo}));

  const data = { ingreso, tiempos, volumen, restriccionesAgregado, siniestros, generadoEn: new Date().toISOString() };
  STATE.raw = data;
  STATE.operativa = construirOperativa(data);
  STATE.filtros = { meses:new Set(), clientes:new Set() };
  STATE.tabla.page = 1;
}

/* ---------- 4. FILTRADO ---------- */
function operativaFiltrada(){
  const {meses, clientes} = STATE.filtros;
  return STATE.operativa.filter(r=>
    (meses.size===0 || meses.has(r.mes)) &&
    (clientes.size===0 || clientes.has(r.cliente))
  );
}
function siniestrosFiltrados(){
  const {meses, clientes} = STATE.filtros;
  return (STATE.raw.siniestros||[]).filter(s=>
    (meses.size===0 || meses.has(s.mes)) &&
    (clientes.size===0 || clientes.has(s.proyecto))
  );
}
function mesesPresentes(rows){
  const set = new Set(rows.map(r=>r.mes));
  return Array.from(set).sort((a,b)=>(MES_ORDEN[a]||99)-(MES_ORDEN[b]||99));
}
function clientesPresentes(rows){
  return Array.from(new Set(rows.map(r=>r.cliente))).sort();
}

/* ---------- 5. COMPARATIVO DE PERÍODO (mes actual vs mes anterior dentro del filtro) ---------- */
function comparativoPeriodo(rows){
  const meses = mesesPresentes(rows);
  if(meses.length===0) return {actual:null, anterior:null, mesActual:null, mesAnterior:null};
  const mesActual = meses[meses.length-1];
  const mesAnterior = meses.length>1 ? meses[meses.length-2] : null;
  const rowsActual = rows.filter(r=>r.mes===mesActual);
  const rowsAnterior = mesAnterior ? rows.filter(r=>r.mes===mesAnterior) : [];
  function agregados(rs){
    if(!rs.length) return null;
    return {
      totalServicios: sum(rs,'totalEntregado'),
      entregados: sum(rs,'entregado'),
      cerradosNovedad: sum(rs,'cerradoNovedad'),
      cumplimiento: weightedAvg(rs,'efectividad','totalEntregado'),
      tiempoProm: weightedAvg(rs,'tiempoMin','entregado'),
      ticketProm: weightedAvg(rs,'percapita','entregado'),
      ingresoTotal: sum(rs,'ingreso'),
      costoTotal: sum(rs,'costo'),
      rentabilidadProm: weightedAvg(rs,'rentabilidad','ingreso'),
      clientesActivos: new Set(rs.map(r=>r.cliente)).size
    };
  }
  return {actual: agregados(rowsActual), anterior: agregados(rowsAnterior), mesActual, mesAnterior};
}
function delta(curr, prev){
  if(curr==null||prev==null||prev===0) return null;
  return (curr-prev)/Math.abs(prev);
}

/* ---------- 6. KPIs MÓDULO 1 ---------- */
function calcularKPIs(){
  const rows = operativaFiltrada();
  if(!rows.length) return null;
  const meses = mesesPresentes(rows);
  const comp = comparativoPeriodo(rows);
  const kpi = {
    totalServicios: sum(rows,'totalEntregado'),
    entregados: sum(rows,'entregado'),
    cerradosNovedad: sum(rows,'cerradoNovedad'),
    cumplimiento: weightedAvg(rows,'efectividad','totalEntregado'),
    tiempoProm: weightedAvg(rows,'tiempoMin','entregado'),
    ticketProm: weightedAvg(rows,'percapita','entregado'),
    ingresoTotal: sum(rows,'ingreso'),
    costoTotal: sum(rows,'costo'),
    rentabilidadProm: weightedAvg(rows,'rentabilidad','ingreso'),
    clientesActivos: clientesPresentes(rows).length,
    mesesCubiertos: meses.length,
    comp
  };
  return kpi;
}

/* Series mensuales agregadas de una métrica, respetando el filtro de clientes activo */
function serieMensual(rows, campo, tipoAgg, pesoCampo){
  const meses = mesesPresentes(rows);
  return meses.map(m=>{
    const rs = rows.filter(r=>r.mes===m);
    let valor;
    if(tipoAgg==='sum') valor = sum(rs,campo);
    else if(tipoAgg==='wavg') valor = weightedAvg(rs,campo,pesoCampo);
    else valor = simpleAvg(rs,campo);
    return {mes:m, valor};
  });
}

/* ---------- 7. SPARKLINES SVG (elemento firma del dashboard) ---------- */
function renderSparkline(valores, colorVar, ancho=90, alto=28){
  const vals = valores.filter(v=>v!=null && !isNaN(v));
  if(vals.length<2) return '';
  const min = Math.min(...vals), max = Math.max(...vals);
  const rango = (max-min)||1;
  const pad = 3;
  const step = (ancho-pad*2)/(vals.length-1);
  const pts = vals.map((v,i)=>{
    const x = pad + i*step;
    const y = alto - pad - ((v-min)/rango)*(alto-pad*2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const last = vals[vals.length-1];
  const lastX = pad + (vals.length-1)*step;
  const lastY = alto - pad - ((last-min)/rango)*(alto-pad*2);
  return `<svg viewBox="0 0 ${ancho} ${alto}" width="${ancho}" height="${alto}">
    <polyline points="${pts}" fill="none" stroke="var(${colorVar})" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2.4" fill="var(${colorVar})"/>
  </svg>`;
}

/* ---------- 8. SEMÁFORO ---------- */
function semaforoNivel(valor){
  if(valor==null||isNaN(valor)) return 'na';
  if(valor>=UMBRAL_BUENO) return 'good';
  if(valor>=UMBRAL_RIESGO) return 'warn';
  return 'bad';
}
function semaforoTexto(nivel){
  return {good:'Excelente', warn:'En riesgo', bad:'Crítico', na:'Sin dato'}[nivel];
}
function pillHTML(nivel){
  if(nivel==='na') return '<span class="pill" style="background:var(--surface-2);color:var(--ink-faint)">Sin dato</span>';
  return `<span class="pill ${nivel}"><svg viewBox="0 0 8 8"><circle cx="4" cy="4" r="4" fill="currentColor"/></svg>${semaforoTexto(nivel)}</span>`;
}

/* ---------- 11. FILTROS (Mes / Cliente) ---------- */
function inicializarFiltros(){
  const mesesDisponibles = Array.from(new Set(STATE.operativa.map(r=>r.mes))).sort((a,b)=>(MES_ORDEN[a]||99)-(MES_ORDEN[b]||99));
  const clientesDisponibles = Array.from(new Set(STATE.operativa.map(r=>r.cliente))).sort();

  const panelMes = document.getElementById('panelFiltroMes');
  panelMes.innerHTML = mesesDisponibles.map(m=>`
    <label class="filter-opt"><input type="checkbox" value="${m}" data-filtro="mes"> ${tituloCaso(m)}</label>
  `).join('');

  const panelCliente = document.getElementById('panelFiltroCliente');
  panelCliente.innerHTML = clientesDisponibles.map(c=>`
    <label class="filter-opt"><input type="checkbox" value="${c}" data-filtro="cliente"> ${tituloCaso(c)}</label>
  `).join('');

  panelMes.querySelectorAll('input').forEach(cb=> cb.addEventListener('change', e=>{
    toggleFiltro(STATE.filtros.meses, e.target.value, e.target.checked);
    actualizarEtiquetasFiltro(); renderTodo();
  }));
  panelCliente.querySelectorAll('input').forEach(cb=> cb.addEventListener('change', e=>{
    toggleFiltro(STATE.filtros.clientes, e.target.value, e.target.checked);
    actualizarEtiquetasFiltro(); renderTodo();
  }));

  document.getElementById('btnFiltroMes').addEventListener('click', e=>{ e.stopPropagation(); togglePanel('panelFiltroMes'); });
  document.getElementById('btnFiltroCliente').addEventListener('click', e=>{ e.stopPropagation(); togglePanel('panelFiltroCliente'); });
  document.addEventListener('click', ()=>{ cerrarPaneles(); });
  document.getElementById('clearFilters').addEventListener('click', ()=>{
    STATE.filtros.meses.clear(); STATE.filtros.clientes.clear();
    panelMes.querySelectorAll('input').forEach(cb=>cb.checked=false);
    panelCliente.querySelectorAll('input').forEach(cb=>cb.checked=false);
    actualizarEtiquetasFiltro(); renderTodo();
  });
}
function toggleFiltro(set, valor, activo){ if(activo) set.add(valor); else set.delete(valor); }
function togglePanel(id){
  const panel = document.getElementById(id);
  const abierto = panel.classList.contains('open');
  cerrarPaneles();
  if(!abierto) panel.classList.add('open');
}
function cerrarPaneles(){ document.querySelectorAll('.filter-panel').forEach(p=>p.classList.remove('open')); }
function actualizarEtiquetasFiltro(){
  const {meses, clientes} = STATE.filtros;
  const lblMes = document.getElementById('labelFiltroMes');
  const lblCliente = document.getElementById('labelFiltroCliente');
  const btnMes = document.getElementById('btnFiltroMes');
  const btnCliente = document.getElementById('btnFiltroCliente');
  lblMes.textContent = meses.size===0 ? 'Mes: Todos' : (meses.size===1 ? 'Mes: '+tituloCaso(Array.from(meses)[0]) : meses.size+' meses');
  lblCliente.textContent = clientes.size===0 ? 'Cliente / Punto: Todos' : (clientes.size===1 ? tituloCaso(Array.from(clientes)[0]) : clientes.size+' clientes');
  btnMes.classList.toggle('has-value', meses.size>0);
  btnCliente.classList.toggle('has-value', clientes.size>0);
  document.getElementById('clearFilters').classList.toggle('show', meses.size>0 || clientes.size>0);
}

/* ---------- 12. TEMA CLARO / OSCURO (con respaldo si localStorage no está disponible) ---------- */
function leerPreferenciaTema(){
  try{ return localStorage.getItem('tc_tema'); }catch(e){ return STATE._temaMemoria || null; }
}
function guardarPreferenciaTema(tema){
  try{ localStorage.setItem('tc_tema', tema); }catch(e){ STATE._temaMemoria = tema; }
}
function aplicarTema(tema){
  STATE.tema = tema;
  document.documentElement.setAttribute('data-theme', tema);
  document.querySelectorAll('[data-theme-btn]').forEach(b=> b.classList.toggle('active', b.getAttribute('data-theme-btn')===tema));
  guardarPreferenciaTema(tema);
  // Recolorear charts (dependen de variables CSS leídas en JS)
  if(STATE.operativa.length) renderTodo();
}
function inicializarTema(){
  const preferidoSistema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const guardado = leerPreferenciaTema();
  aplicarTema(guardado || preferidoSistema);
  document.querySelectorAll('[data-theme-btn]').forEach(b=>{
    b.addEventListener('click', ()=> aplicarTema(b.getAttribute('data-theme-btn')));

}

/* ---------- 14. UTILIDADES DE GRÁFICOS (Chart.js) ---------- */
function cssColor(varName){ return getComputedStyle(document.documentElement).getPropertyValue(varName).trim(); }
function configurarChartDefaults(){
  if(typeof Chart==='undefined') return;
  Chart.defaults.font.family = "'Inter', sans-serif";
  Chart.defaults.font.size = 11.5;
  Chart.defaults.color = cssColor('--ink-muted');
  Chart.defaults.plugins.legend.labels.usePointStyle = true;
  Chart.defaults.plugins.legend.labels.boxWidth = 8;
  Chart.defaults.plugins.legend.labels.padding = 14;
}
function crearChart(id, config){
  const canvas = document.getElementById(id);
  if(!canvas) return null;
  if(STATE.charts[id]){ STATE.charts[id].destroy(); }
  const ctx = canvas.getContext('2d');
  const chart = new Chart(ctx, config);
  STATE.charts[id] = chart;
  return chart;
}
function gridStyle(){ return { color: cssColor('--border'), drawBorder:false }; }

/* ---------- 15. MÓDULO 1 · RESUMEN EJECUTIVO ---------- */
const METRIC_SPECS = [
  {key:'totalServicios', label:'Total de Servicios', icono:'package', colorVar:'--brand', fmt:fmtInt, serie:{campo:'totalEntregado', agg:'sum'}},
  {key:'entregados', label:'Servicios Entregados', icono:'checkCircle', colorVar:'--good', fmt:fmtInt, serie:{campo:'entregado', agg:'sum'}},
  {key:'cerradosNovedad', label:'Cerrados con Novedad', icono:'triangle', colorVar:'--warn', fmt:fmtInt, serie:{campo:'cerradoNovedad', agg:'sum'}},
  {key:'cumplimiento', label:'Cumplimiento / Efectividad', icono:'target', colorVar:'--accent', fmt:fmtPct, serie:{campo:'efectividad', agg:'wavg', peso:'totalEntregado'}},
  {key:'tiempoProm', label:'Tiempo Promedio de Entrega', icono:'clock', colorVar:'--brand', fmt:fmtMin, serie:{campo:'tiempoMin', agg:'wavg', peso:'entregado'}},
  {key:'ticketProm', label:'Ticket Promedio (Per Cápita)', icono:'tag', colorVar:'--accent', fmt:fmtCOPk, serie:{campo:'percapita', agg:'wavg', peso:'entregado'}},
  {key:'clientesActivos', label:'Clientes / Puntos Activos', icono:'mapPin', colorVar:'--brand', fmt:fmtInt, serie:'clientes'},
  {key:'ingresoTotal', label:'Ingreso Total', icono:'dollar', colorVar:'--good', fmt:fmtCOPk, serie:{campo:'ingreso', agg:'sum'}},
  {key:'rentabilidadProm', label:'Rentabilidad Promedio', icono:'trending', colorVar:'--accent', fmt:fmtPct, serie:{campo:'rentabilidad', agg:'wavg', peso:'ingreso'}},
];

function serieParaSpec(rows, spec){
  const meses = mesesPresentes(rows);
  if(spec.serie==='clientes'){
    return meses.map(m=> new Set(rows.filter(r=>r.mes===m).map(r=>r.cliente)).size);
  }
  const {campo, agg, peso} = spec.serie;
  return meses.map(m=>{
    const rs = rows.filter(r=>r.mes===m);
    if(agg==='sum') return sum(rs,campo);
    if(agg==='wavg') return weightedAvg(rs,campo,peso);
    return simpleAvg(rs,campo);
  });
}

function calcularDeltaSpec(key, comp){
  if(!comp || !comp.actual || !comp.anterior) return null;
  const curr = comp.actual[key], prev = comp.anterior[key];
  if(curr==null||prev==null||isNaN(curr)||isNaN(prev)) return null;
  const esPuntoPorc = (key==='cumplimiento' || key==='rentabilidadProm');
  if(esPuntoPorc){
    return {valor:(curr-prev)*100, sufijo:' pp', esPP:true};
  }
  if(prev===0) return null;
  return {valor:((curr-prev)/Math.abs(prev))*100, sufijo:'%', esPP:false};
}

function renderResumen(){
  const sec = document.getElementById('sec-resumen');
  const kpi = calcularKPIs();
  if(!kpi){ sec.classList.add('module-hidden'); return; }
  sec.classList.remove('module-hidden');
  const rows = operativaFiltrada();
  const grid = document.getElementById('kpiGrid');

  grid.innerHTML = METRIC_SPECS.filter(spec=> kpi[spec.key]!=null && !isNaN(kpi[spec.key])).map(spec=>{
    const valor = kpi[spec.key];
    const serie = serieParaSpec(rows, spec);
    const spark = renderSparkline(serie, spec.colorVar);
    const d = calcularDeltaSpec(spec.key, kpi.comp);
    let deltaHTML = '';
    if(d){
      const dir = Math.abs(d.valor)<0.05 ? 'flat' : (d.valor>0 ? 'up' : 'down');
      const ic = dir==='up' ? 'up' : (dir==='down' ? 'down' : 'flat');
      deltaHTML = `<div class="kpi-delta ${dir}">${icon(ic)}${d.valor>0?'+':''}${d.valor.toFixed(1)}${d.sufijo}</div>`;
    } else {
      deltaHTML = `<div class="kpi-delta flat">${icon('flat')}s/d</div>`;
    }
    return `
      <div class="card kpi-card hoverable">
        <div class="kpi-top">
          <div>
            <div class="kpi-label">${spec.label}</div>
            <div class="kpi-value">${spec.fmt(valor)}</div>
          </div>
          <div class="kpi-icon" style="background:var(${spec.colorVar}-soft); color:var(${spec.colorVar})">${icon(spec.icono)}</div>
        </div>
        <div class="kpi-bottom">
          ${deltaHTML}
          <div class="kpi-spark">${spark}</div>
        </div>
      </div>`;
  }).join('');

  const mesTxt = kpi.comp.mesActual ? tituloCaso(kpi.comp.mesActual) + (kpi.comp.mesAnterior? ' vs '+tituloCaso(kpi.comp.mesAnterior) : '') : '';
  document.getElementById('lastUpdate').textContent = 'Última actualización: '+ new Date(STATE.raw.generadoEn).toLocaleString('es-CO') + (mesTxt? ' · '+mesTxt : '');
}

/* ---------- 18. MÓDULO 4 · NOVEDADES (SINIESTROS) ---------- */
function renderNovedades(){
  const sec = document.getElementById('sec-novedades');
  const siniestros = siniestrosFiltrados();
  const rows = operativaFiltrada();
  const hayNovedadOperativa = rows.some(r=>r.cerradoNovedad!=null);
  if(!siniestros.length && !hayNovedadOperativa){ sec.classList.add('module-hidden'); return; }
  sec.classList.remove('module-hidden');

  // Agrupar siniestros por motivo
  const porMotivo = {};
  siniestros.forEach(s=>{
    const m = s.motivo || 'SIN CLASIFICAR';
    porMotivo[m] = porMotivo[m] || {valor:0, cantidad:0};
    porMotivo[m].valor += Number(s.valor)||0;
    porMotivo[m].cantidad += 1;
  });
  const motivos = Object.entries(porMotivo).map(([motivo,v])=>({motivo, ...v})).sort((a,b)=>b.valor-a.valor);
  const totalValor = motivos.reduce((a,m)=>a+m.valor,0);

  if(motivos.length){
    document.getElementById('chartTopMotivos').closest('.card').classList.remove('module-hidden');
    crearChart('chartTopMotivos', {
      type:'bar',
      data:{ labels: motivos.map(m=>tituloCaso(m.motivo)), datasets:[{
        data: motivos.map(m=>m.valor), backgroundColor: cssColor('--warn'), borderRadius:6, maxBarThickness:30
      }]},
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>' '+fmtCOP(c.parsed.x)}}},
        scales:{ x:{beginAtZero:true, grid:gridStyle(), ticks:{callback:v=>fmtCOPk(v)}}, y:{grid:{display:false}} } }
    });
    const paleta = [cssColor('--brand'), cssColor('--accent'), cssColor('--warn'), cssColor('--bad'), cssColor('--good'), cssColor('--brand-strong')];
    crearChart('chartDistribucionMotivos', {
      type:'doughnut',
      data:{ labels: motivos.map(m=>tituloCaso(m.motivo)), datasets:[{ data: motivos.map(m=>m.valor), backgroundColor: motivos.map((_,i)=>paleta[i%paleta.length]), borderColor:cssColor('--surface'), borderWidth:2 }]},
      options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
        plugins:{ legend:{position:'bottom'}, tooltip:{callbacks:{label:c=>{ const pct = totalValor? (c.parsed/totalValor*100).toFixed(1):0; return ' '+c.label+': '+fmtCOPk(c.parsed)+' ('+pct+'%)'; }}} } }
    });
    document.getElementById('rankingNovedades').innerHTML = motivos.map((m,i)=>{
      const pct = totalValor? (m.valor/totalValor*100) : 0;
      return `<div class="rank-row">
        <span class="rank-pos">${i+1}</span>
        <span class="rank-name">${tituloCaso(m.motivo)} <span class="mono" style="color:var(--ink-faint);font-size:11px;">(${m.cantidad})</span></span>
        <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${pct}%"></div></div>
        <span class="rank-value">${fmtCOPk(m.valor)}</span>
      </div>`;
    }).join('');
  } else {
    document.getElementById('chartTopMotivos').closest('.card').classList.add('module-hidden');
    document.getElementById('chartDistribucionMotivos').closest('.card').classList.add('module-hidden');
    document.getElementById('rankingNovedades').innerHTML = '<div class="table-info">No se registraron siniestros en el período filtrado.</div>';
  }

  if(hayNovedadOperativa){
    document.getElementById('chartTasaNovedad').closest('.card').classList.remove('module-hidden');
    const meses = mesesPresentes(rows);
    const tasa = meses.map(m=>{
      const rs = rows.filter(r=>r.mes===m);
      const tot = sum(rs,'totalEntregado');
      return tot? (sum(rs,'cerradoNovedad')/tot*100) : null;
    });
    crearChart('chartTasaNovedad', {
      type:'bar',
      data:{ labels: meses.map(m=>MES_CORTO[m]||m), datasets:[{ data: tasa.map(v=>v!=null?+v.toFixed(2):null), backgroundColor: cssColor('--bad'), borderRadius:6, maxBarThickness:30 }]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>' '+c.parsed.y+'% cerrados con novedad'}}},
        scales:{ y:{beginAtZero:true, grid:gridStyle(), ticks:{callback:v=>v+'%'}}, x:{grid:{display:false}} } }
    });
  } else {
    document.getElementById('chartTasaNovedad').closest('.card').classList.add('module-hidden');
  }
}

/* ---------- 21. RANK LIST HELPER ---------- */
function pintarRankList(elId, items, opts={}){
  const el = document.getElementById(elId);
  if(!items.length){ el.innerHTML = '<div class="table-info">Sin datos suficientes.</div>'; return; }
  const max = Math.max(...items.map(i=>i.valor)) || 1;
  el.innerHTML = items.map((it,i)=>`
    <div class="rank-row">
      <span class="rank-pos">${i+1}</span>
      <span class="rank-name">${tituloCaso(it.nombre)}</span>
      <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${(it.valor/max*100).toFixed(0)}%; ${it.color?('background:'+it.color+';'):''}"></div></div>
      <span class="rank-value">${it.fmt ? it.fmt(it.valor) : fmtInt(it.valor)}</span>
    </div>`).join('');
}

/* ---------- 22. MÓDULO 7 · RANKINGS ---------- */
function renderRankings(){
  const sec = document.getElementById('sec-rankings');
  const rows = operativaFiltrada();
  if(!rows.length){ sec.classList.add('module-hidden'); return; }
  sec.classList.remove('module-hidden');
  const clientes = clientesPresentes(rows);

  const porVolumen = clientes.map(c=>({nombre:c, valor: sum(rows.filter(r=>r.cliente===c),'totalEntregado')})).sort((a,b)=>b.valor-a.valor).slice(0,8);
  pintarRankList('rankVolumen', porVolumen.map(x=>({...x, fmt:fmtInt})));

  const porCumplimiento = clientes.map(c=>{
    const rs = rows.filter(r=>r.cliente===c);
    return {nombre:c, valor: weightedAvg(rs,'efectividad','totalEntregado')};
  }).filter(x=>x.valor!=null).sort((a,b)=>b.valor-a.valor).slice(0,8);
  pintarRankList('rankCumplimiento', porCumplimiento.map(x=>({...x, fmt:v=>fmtPct(v)})));

  const porRentabilidad = clientes.map(c=>{
    const rs = rows.filter(r=>r.cliente===c);
    return {nombre:c, valor: weightedAvg(rs,'rentabilidad','ingreso')};
  }).filter(x=>x.valor!=null).sort((a,b)=>b.valor-a.valor).slice(0,8);
  pintarRankList('rankRentabilidad', porRentabilidad.map(x=>({...x, fmt:v=>fmtPct(v)})));

  const siniestros = siniestrosFiltrados();
  const porMotivo = {};
  siniestros.forEach(s=>{ const m=s.motivo||'SIN CLASIFICAR'; porMotivo[m]=(porMotivo[m]||0)+(Number(s.valor)||0); });
  const rankMotivos = Object.entries(porMotivo).map(([nombre,valor])=>({nombre,valor})).sort((a,b)=>b.valor-a.valor).slice(0,8);
  pintarRankList('rankMotivos', rankMotivos.map(x=>({...x, fmt:v=>fmtCOPk(v)})));

  const ciudadesConteo = {};
  siniestros.forEach(s=>{ if(s.ciudad) ciudadesConteo[s.ciudad] = (ciudadesConteo[s.ciudad]||0)+1; });
  const restrCiudad = (STATE.raw.restriccionesAgregado||{}).porCiudad || {};
  Object.entries(restrCiudad).forEach(([c,n])=>{ ciudadesConteo[c] = (ciudadesConteo[c]||0)+n; });
  const rankCiudades = Object.entries(ciudadesConteo).map(([nombre,valor])=>({nombre,valor})).sort((a,b)=>b.valor-a.valor).slice(0,8);
  pintarRankList('rankCiudades', rankCiudades.map(x=>({...x, fmt:fmtInt})));

  const porTicket = clientes.map(c=>{
    const rs = rows.filter(r=>r.cliente===c && r.percapita!=null);
    return {nombre:c, valor: weightedAvg(rs,'percapita','entregado')};
  }).filter(x=>x.valor!=null).sort((a,b)=>b.valor-a.valor).slice(0,8);
  pintarRankList('rankTicket', porTicket.map(x=>({...x, fmt:v=>fmtCOP(v)})));
}

/* ---------- 23. MÓDULO 8 · CENTRO DE ALERTAS (reglas, sin IA) ---------- */
function renderAlertas(){
  const rows = operativaFiltrada();
  const siniestros = siniestrosFiltrados();
  const alertas = [];

  if(rows.length){
    const clientes = clientesPresentes(rows);
    const meses = mesesPresentes(rows);
    const ultimoMes = meses[meses.length-1];
    const penultimoMes = meses.length>1 ? meses[meses.length-2] : null;

    // Bajo cumplimiento por cliente (último mes disponible)
    clientes.forEach(c=>{
      const rs = rows.filter(r=>r.cliente===c && r.mes===ultimoMes);
      const ef = weightedAvg(rs,'efectividad','totalEntregado');
      if(ef!=null){
        const nivel = semaforoNivel(ef);
        if(nivel==='bad') alertas.push({sev:'bad', icono:'alert', titulo:'Cumplimiento crítico: '+tituloCaso(c), desc:`Efectividad de ${fmtPct(ef)} en ${tituloCaso(ultimoMes)}, por debajo del umbral crítico (${fmtPct(UMBRAL_RIESGO)}).`});
        else if(nivel==='warn') alertas.push({sev:'warn', icono:'alert', titulo:'Cumplimiento en riesgo: '+tituloCaso(c), desc:`Efectividad de ${fmtPct(ef)} en ${tituloCaso(ultimoMes)}, cerca del límite aceptable.`});
      }
    });

    // Incremento de novedades (cerradoNovedad) mes a mes
    if(penultimoMes){
      clientes.forEach(c=>{
        const rsAct = rows.filter(r=>r.cliente===c && r.mes===ultimoMes);
        const rsAnt = rows.filter(r=>r.cliente===c && r.mes===penultimoMes);
        const act = sum(rsAct,'cerradoNovedad'), ant = sum(rsAnt,'cerradoNovedad');
        if(ant>0){
          const cambio = (act-ant)/ant;
          if(cambio>=0.20) alertas.push({sev:'warn', icono:'triangle', titulo:'Incremento de novedades: '+tituloCaso(c), desc:`Los cierres con novedad subieron ${(cambio*100).toFixed(0)}% frente a ${tituloCaso(penultimoMes)} (${fmtInt(ant)} → ${fmtInt(act)}).`});
        }
      });
    }

    // Rentabilidad baja
    clientes.forEach(c=>{
      const rs = rows.filter(r=>r.cliente===c && r.mes===ultimoMes);
      const rent = weightedAvg(rs,'rentabilidad','ingreso');
      if(rent!=null && rent<0.15) alertas.push({sev: rent<0.10?'bad':'warn', icono:'trending', titulo:'Rentabilidad baja: '+tituloCaso(c), desc:`Rentabilidad de ${fmtPct(rent)} en ${tituloCaso(ultimoMes)}, por debajo del 15% de referencia.`});
    });

    // Tiempos elevados (comparado con el promedio global filtrado)
    const rowsConTiempo = rows.filter(r=>r.tiempoMin!=null);
    if(rowsConTiempo.length){
      const promGlobal = weightedAvg(rowsConTiempo,'tiempoMin','entregado');
      clientes.forEach(c=>{
        const rs = rowsConTiempo.filter(r=>r.cliente===c && r.mes===ultimoMes);
        const t = weightedAvg(rs,'tiempoMin','entregado');
        if(t!=null && promGlobal && t > promGlobal*1.2) alertas.push({sev:'warn', icono:'clock', titulo:'Tiempo de entrega elevado: '+tituloCaso(c), desc:`Promedio de ${fmtMin(t)} en ${tituloCaso(ultimoMes)}, superior al promedio general (${fmtMin(promGlobal)}).`});
      });
    }
  }

  // Siniestros pendientes de pago al cliente
  const pendientes = siniestros.filter(s=> (s.pagoCliente||'').toUpperCase().includes('PENDIENTE'));
  if(pendientes.length){
    const valorPend = sum(pendientes,'valor');
    alertas.push({sev:'warn', icono:'dollar', titulo:'Siniestros con pago pendiente al cliente', desc:`${pendientes.length} siniestro(s) por un valor total de ${fmtCOP(valorPend)} aún no han sido pagados al cliente.`});
  }

  // Restricciones activas (agregado, sin datos personales)
  const restrAgg = STATE.raw.restriccionesAgregado || {total:0, porEstado:{}};
  const activas = restrAgg.porEstado ? (restrAgg.porEstado['ACTIVO CON RESTRICCION']||0) : 0;
  if(activas>0){
    alertas.push({sev:'warn', icono:'shield', titulo:'Colaboradores con restricciones médicas activas', desc:`${activas} colaborador(es) con restricción médica activa. Ver módulo Personal para el detalle agregado por ciudad.`});
  }

  const orden = {bad:0, warn:1, good:2};
  alertas.sort((a,b)=>orden[a.sev]-orden[b.sev]);

  document.getElementById('navcount-alertas').textContent = alertas.length || '';
  document.getElementById('navcount-alertas').classList.toggle('alert', alertas.filter(a=>a.sev==='bad').length>0);

  const lista = document.getElementById('alertasLista');
  if(!alertas.length){
    lista.innerHTML = `<div class="empty-alerts">${icon('smile')}<div>No se detectaron alertas para el período y los filtros seleccionados.<br>La operación se encuentra dentro de los parámetros esperados.</div></div>`;
    return;
  }
  lista.innerHTML = alertas.map(a=>`
    <div class="alert-item">
      <div class="alert-icon" style="background:var(--${a.sev}-soft); color:var(--${a.sev})">${icon(a.icono==='shield'?'shield':a.icono)}</div>
      <div class="alert-body"><div class="alert-title">${a.titulo}</div><div class="alert-desc">${a.desc}</div></div>
      ${pillHTML(a.sev)}
    </div>`).join('');
}

/* ---------- 24. MÓDULO 9 · INSIGHTS ---------- */
function renderInsights(){
  const sec = document.getElementById('sec-insights');
  const rows = operativaFiltrada();
  if(!rows.length){ sec.classList.add('module-hidden'); return; }
  sec.classList.remove('module-hidden');
  const clientes = clientesPresentes(rows);
  const meses = mesesPresentes(rows);
  const insights = [];

  // 1. Cliente con mayor volumen
  const volPorCliente = clientes.map(c=>({c, v: sum(rows.filter(r=>r.cliente===c),'totalEntregado')})).sort((a,b)=>b.v-a.v);
  if(volPorCliente.length) insights.push({tag:'Volumen', html:`<b>${tituloCaso(volPorCliente[0].c)}</b> concentra el mayor volumen del período, con ${fmtInt(volPorCliente[0].v)} servicios totales.`});

  // 2. Cliente con mejor cumplimiento
  const cumpPorCliente = clientes.map(c=>({c, v: weightedAvg(rows.filter(r=>r.cliente===c),'efectividad','totalEntregado')})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);
  if(cumpPorCliente.length) insights.push({tag:'Cumplimiento', html:`<b>${tituloCaso(cumpPorCliente[0].c)}</b> registra el mejor cumplimiento del período, con ${fmtPct(cumpPorCliente[0].v)} de efectividad.`});

  // 3. Cliente con mayor crecimiento (primer mes vs último mes)
  if(meses.length>1){
    const crecimientos = clientes.map(c=>{
      const primero = sum(rows.filter(r=>r.cliente===c && r.mes===meses[0]),'totalEntregado');
      const ultimo = sum(rows.filter(r=>r.cliente===c && r.mes===meses[meses.length-1]),'totalEntregado');
      const cambio = primero>0 ? (ultimo-primero)/primero : null;
      return {c, cambio};
    }).filter(x=>x.cambio!=null).sort((a,b)=>b.cambio-a.cambio);
    if(crecimientos.length){
      const top = crecimientos[0];
      const verbo = top.cambio>=0 ? 'creció' : 'disminuyó';
      insights.push({tag:'Crecimiento', html:`El volumen de <b>${tituloCaso(top.c)}</b> ${verbo} ${Math.abs(top.cambio*100).toFixed(0)}% entre ${tituloCaso(meses[0])} y ${tituloCaso(meses[meses.length-1])}.`});
    }
  }

  // 4. Principal causa de siniestros
  const siniestros = siniestrosFiltrados();
  if(siniestros.length){
    const porMotivo = {};
    siniestros.forEach(s=>{ const m=s.motivo||'sin clasificar'; porMotivo[m]=(porMotivo[m]||0)+(Number(s.valor)||0); });
    const top = Object.entries(porMotivo).sort((a,b)=>b[1]-a[1])[0];
    insights.push({tag:'Novedades', html:`La principal causa de siniestros es <b>${tituloCaso(top[0])}</b>, con un valor acumulado de ${fmtCOP(top[1])}.`});
  }

  // 5. Tendencia del período
  if(meses.length>1){
    const primero = sum(rows.filter(r=>r.mes===meses[0]),'totalEntregado');
    const ultimo = sum(rows.filter(r=>r.mes===meses[meses.length-1]),'totalEntregado');
    if(primero>0){
      const cambio = (ultimo-primero)/primero;
      const texto = Math.abs(cambio)<0.03 ? 'se mantuvo estable' : (cambio>0 ? `mostró una tendencia creciente (+${(cambio*100).toFixed(0)}%)` : `mostró una tendencia decreciente (${(cambio*100).toFixed(0)}%)`);
      insights.push({tag:'Tendencia', html:`El volumen total de servicios ${texto} entre ${tituloCaso(meses[0])} y ${tituloCaso(meses[meses.length-1])}.`});
    }
  }

  document.getElementById('insightsLista').innerHTML = insights.map((it,i)=>`
    <div class="card insight-card hoverable">
      <div class="insight-num">0${i+1}</div>
      <div><div class="insight-text"><span class="tag">${it.tag}</span><br>${it.html}</div></div>
    </div>`).join('');
}

/* ---------- 26. MÓDULO 10 · TABLA OPERATIVA ---------- */
const COLUMNAS_TABLA = [
  {key:'cliente', label:'Cliente / Punto', tipo:'txt'},
  {key:'mes', label:'Mes', tipo:'txt', fmt:tituloCaso},
  {key:'entregado', label:'Entregados', tipo:'num', fmt:fmtInt},
  {key:'cerradoNovedad', label:'Cerr. c/Novedad', tipo:'num', fmt:fmtInt},
  {key:'totalEntregado', label:'Total Servicios', tipo:'num', fmt:fmtInt},
  {key:'efectividad', label:'Efectividad', tipo:'num', fmt:v=>fmtPct(v)},
  {key:'tiempoMin', label:'Tiempo (min)', tipo:'num', fmt:v=>fmtNum(v,1)},
  {key:'ingreso', label:'Ingreso', tipo:'num', fmt:fmtCOP},
  {key:'costo', label:'Costo', tipo:'num', fmt:fmtCOP},
  {key:'rentabilidad', label:'Rentabilidad', tipo:'num', fmt:v=>fmtPct(v)},
  {key:'percapita', label:'Ticket Promedio', tipo:'num', fmt:fmtCOP},
];

function filasTablaProcesadas(){
  let rows = operativaFiltrada().slice();
  const q = STATE.tabla.search.trim().toLowerCase();
  if(q){
    rows = rows.filter(r=> String(r.cliente).toLowerCase().includes(q) || String(r.mes).toLowerCase().includes(q));
  }
  const {sortCol, sortDir} = STATE.tabla;
  rows.sort((a,b)=>{
    let va = a[sortCol], vb = b[sortCol];
    if(sortCol==='mes'){ va = MES_ORDEN[va]||0; vb = MES_ORDEN[vb]||0; }
    if(typeof va==='string' || typeof vb==='string'){
      va = (va==null?'':String(va)); vb = (vb==null?'':String(vb));
      return sortDir==='asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    }
    va = va==null?-Infinity:va; vb = vb==null?-Infinity:vb;
    return sortDir==='asc' ? va-vb : vb-va;
  });
  return rows;
}

function ordenarTablaPor(key){
  if(STATE.tabla.sortCol===key){ STATE.tabla.sortDir = STATE.tabla.sortDir==='asc' ? 'desc' : 'asc'; }
  else { STATE.tabla.sortCol = key; STATE.tabla.sortDir = 'asc'; }
  STATE.tabla.page = 1;
  renderTabla();
}
function irAPagina(p){ STATE.tabla.page = p; renderTabla(); }

function renderTabla(){
  const sec = document.getElementById('sec-tabla');
  if(!STATE.operativa.length){ sec.classList.add('module-hidden'); return; }
  sec.classList.remove('module-hidden');

  const head = document.getElementById('tablaHead');
  head.innerHTML = COLUMNAS_TABLA.map(c=>{
    const activa = STATE.tabla.sortCol===c.key;
    const flecha = activa ? (STATE.tabla.sortDir==='asc'?'▲':'▼') : '↕';
    return `<th class="${activa?'sorted':''}" onclick="ordenarTablaPor('${c.key}')">${c.label}<span class="sort-ic">${flecha}</span></th>`;
  }).join('');

  const filas = filasTablaProcesadas();
  const {page, pageSize} = STATE.tabla;
  const totalPaginas = Math.max(1, Math.ceil(filas.length/pageSize));
  const paginaActual = Math.min(page, totalPaginas);
  const inicio = (paginaActual-1)*pageSize;
  const filasPagina = filas.slice(inicio, inicio+pageSize);

  const body = document.getElementById('tablaBody');
  if(!filasPagina.length){
    body.innerHTML = `<tr><td colspan="${COLUMNAS_TABLA.length}" style="text-align:center;color:var(--ink-faint);padding:26px;">Sin resultados para la búsqueda o filtros aplicados.</td></tr>`;
  } else {
    body.innerHTML = filasPagina.map(r=>`<tr>${COLUMNAS_TABLA.map(c=>{
      const val = r[c.key];
      const txt = c.fmt ? c.fmt(val) : (val==null?'—':val);
      return `<td class="${c.tipo==='txt'?'txt':''}">${txt}</td>`;
    }).join('')}</tr>`).join('');
  }

  document.getElementById('tablaInfo').textContent = filas.length
    ? `Mostrando ${inicio+1}–${Math.min(inicio+pageSize, filas.length)} de ${filas.length} registros`
    : 'Sin registros';

  const pag = document.getElementById('tablaPaginacion');
  let btns = `<button class="page-btn" ${paginaActual===1?'disabled':''} onclick="irAPagina(${paginaActual-1})">${icon('chevLeft')}</button>`;
  const maxBtns = 5;
  let ini = Math.max(1, paginaActual-Math.floor(maxBtns/2));
  let fin = Math.min(totalPaginas, ini+maxBtns-1);
  ini = Math.max(1, fin-maxBtns+1);
  for(let p=ini; p<=fin; p++){
    btns += `<button class="page-btn ${p===paginaActual?'active':''}" onclick="irAPagina(${p})">${p}</button>`;
  }
  btns += `<button class="page-btn" ${paginaActual===totalPaginas?'disabled':''} onclick="irAPagina(${paginaActual+1})">${icon('chevRight')}</button>`;
  pag.innerHTML = btns;
}

/* ---------- 27. EXPORTACIÓN Y BÚSQUEDA DE LA TABLA ---------- */
function datosExportables(){
  const filas = filasTablaProcesadas();
  return filas.map(r=>{
    const out = {};
    COLUMNAS_TABLA.forEach(c=>{ out[c.label] = c.fmt ? c.fmt(r[c.key]) : r[c.key]; });
    return out;
  });
}

function exportarExcel(){
  const datos = datosExportables();
  if(!datos.length) return;
  const ws = XLSX.utils.json_to_sheet(datos);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Tabla Operativa');
  XLSX.writeFile(wb, 'torre_control_tabla_operativa.xlsx');
}

function exportarPDF(){
  const datos = datosExportables();
  if(!datos.length) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:'landscape'});
  doc.setFontSize(13);
  doc.text('Torre de Control Operativa — Tabla Operativa', 14, 14);
  doc.setFontSize(9);
  doc.text('Generado: ' + new Date().toLocaleString('es-CO'), 14, 20);
  const head = [COLUMNAS_TABLA.map(c=>c.label)];
  const body = datos.map(d=>COLUMNAS_TABLA.map(c=>d[c.label]));
  doc.autoTable({ head, body, startY:26, styles:{fontSize:7.5}, headStyles:{fillColor:[18,58,94]} });
  doc.save('torre_control_tabla_operativa.pdf');
}

function imprimirTabla(){
  const datos = datosExportables();
  const ventana = window.open('', '_blank');
  const filasHTML = datos.map(d=>`<tr>${COLUMNAS_TABLA.map(c=>`<td>${d[c.label]}</td>`).join('')}</tr>`).join('');
  ventana.document.write(`<html><head><title>Tabla Operativa</title>
    <style>
      body{font-family:Arial,sans-serif; padding:24px; color:#101B2D;}
      h1{font-size:16px;} p{font-size:11px;color:#666;margin-top:-6px;}
      table{border-collapse:collapse; width:100%; font-size:11px;}
      th,td{border:1px solid #ccc; padding:6px 8px; text-align:left;}
      th{background:#F3F6FA;}
    </style></head><body>
    <h1>Torre de Control Operativa — Tabla Operativa</h1>
    <p>Generado: ${new Date().toLocaleString('es-CO')}</p>
    <table><thead><tr>${COLUMNAS_TABLA.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>${filasHTML}</tbody></table>
    </body></html>`);
  ventana.document.close();
  ventana.focus();
  setTimeout(()=>ventana.print(), 300);
}

/* ---------- 28. RENDER MAESTRO ---------- */
function renderTodo(){
  renderResumen();
  renderComportamiento();
  renderCumplimiento();
  renderNovedades();
  renderProductividad();
  renderTicket();
  renderRankings();
  renderAlertas();
  renderInsights();
  renderTabla();
  renderPersonal();

  // Contadores auxiliares en la barra lateral
  const rows = operativaFiltrada();
  const nc = (id,val)=>{ const el = document.getElementById('navcount-'+id); if(el) el.textContent = val; };
  nc('tabla', rows.length || '');
  nc('novedades', siniestrosFiltrados().length || '');
  nc('rankings', clientesPresentes(rows).length || '');
  const restrTotal = (STATE.raw.restriccionesAgregado||{}).total || 0;
  nc('personal', restrTotal || '');
}

/* ---------- 29. PANTALLA DE CARGA ---------- */
function simularCarga(alTerminar){
  const fill = document.getElementById('progressFill');
  const txt = document.getElementById('progressPct');
  let pct = 0;
  const iv = setInterval(()=>{
    pct += Math.random()*22 + 10;
    if(pct >= 100){
      pct = 100; clearInterval(iv);
      fill.style.width = '100%'; txt.textContent = 'Listo · 100%';
      setTimeout(()=>{
        document.getElementById('loading-screen').classList.add('hidden');
        alTerminar && alTerminar();
      }, 320);
    } else {
      fill.style.width = pct + '%';
      txt.textContent = 'Cargando datos… ' + Math.round(pct) + '%';
    }
  }, 130);
}

/* ---------- 30. CARGA DE UN NUEVO EXCEL DESDE EL NAVEGADOR ---------- */
function manejarArchivoSeleccionado(evt){
  const file = evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type:'array', cellDates:true});
      procesarWorkbookCargado(workbook);
      inicializarFiltros();
      actualizarEtiquetasFiltro();
      renderTodo();
    }catch(err){
      console.error(err);
      alert('No se pudo leer el archivo. Verifica que mantenga la misma estructura de hojas (INGRESO, TIEMPOS, VOLUMEN, RESTRICCIONES, SINIESTROS).');
    }
  };
  reader.readAsArrayBuffer(file);
  evt.target.value = '';
}

/* ---------- 31. EVENTOS DE INTERFAZ (tabla, sidebar móvil) ---------- */
function inicializarEventosUI(){
  document.getElementById('tablaSearch').addEventListener('input', e=>{
    STATE.tabla.search = e.target.value;
    STATE.tabla.page = 1;
    renderTabla();
  });
  document.getElementById('btnExportCSV').addEventListener('click', exportarExcel);
  document.getElementById('btnExportPDF').addEventListener('click', exportarPDF);
  document.getElementById('btnImprimir').addEventListener('click', imprimirTabla);
  document.getElementById('fileInput').addEventListener('change', manejarArchivoSeleccionado);
  document.getElementById('sidebarToggle') && document.getElementById('sidebarToggle').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('open');
  });
}

/* ---------- 32. INICIALIZACIÓN GENERAL ---------- */
function iniciarAplicacion(){
  cargarDatosEmbebidos();
  construirEsqueleto();
  renderSidebarNav();
  inicializarFiltros();
  actualizarEtiquetasFiltro();
  inicializarEventosUI();
  configurarChartDefaults();
  inicializarTema(); // internamente llama a renderTodo()
  activarScrollSpy();
  simularCarga();
}

document.addEventListener('DOMContentLoaded', iniciarAplicacion);

</script>
